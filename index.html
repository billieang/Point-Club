<style>
:root{--green:#173f35;--green2:#24634f;--mint:#dff2e8;--bg:#f4f7f5;--card:#fff;--text:#1c2924;--muted:#65746d;--line:#dfe7e2;--red:#b42318;--gold:#946200;--shadow:0 5px 18px rgba(20,50,38,.06)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:11px 14px;font-weight:650;background:var(--green);color:white}button:disabled{opacity:.45;cursor:not-allowed}.secondary{background:#edf3ef;color:var(--green);border:1px solid var(--line)}.danger{background:#fff0ee;color:var(--red);border:1px solid #f2d1cd}.small{padding:7px 10px;border-radius:9px;font-size:14px}.app{max-width:760px;margin:auto;min-height:100vh;padding-bottom:92px}.top{background:var(--green);color:white;padding:22px 18px 24px;border-radius:0 0 24px 24px}.brand{display:flex;align-items:center;gap:10px;font-weight:750;font-size:19px}.brand-mark{width:40px;height:40px;border-radius:13px;background:#2d6b55;display:grid;place-items:center;font-size:22px}.eyebrow{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:#c5ded2;margin-top:20px}.balance{font-size:36px;font-weight:800;letter-spacing:-.04em;margin:2px 0}.balance small{font-size:15px;font-weight:600;letter-spacing:0;color:#d5e6dc}.topline{display:flex;align-items:center;justify-content:space-between;gap:10px}.today{font-size:13px;color:#d5e6dc}.content{padding:18px 14px}.pagehead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin:2px 2px 16px}.pagehead h1{font-size:23px;margin:0}.sub{font-size:13px;color:var(--muted);margin-top:3px}.nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:7px max(8px,env(safe-area-inset-right)) calc(7px + env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));z-index:10}.nav button{background:transparent;color:var(--muted);padding:7px 3px;font-size:11px;display:flex;align-items:center;flex-direction:column;gap:3px}.nav button .ico{font-size:20px}.nav button.active{color:var(--green);background:var(--mint)}.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:15px;margin-bottom:11px;box-shadow:var(--shadow)}.itemtop{display:flex;align-items:flex-start;gap:12px}.itemicon{width:43px;height:43px;border-radius:13px;background:#edf5f0;display:grid;place-items:center;font-size:21px;flex-shrink:0}.itemmain{flex:1;min-width:0}.itemtitle{font-weight:750;overflow-wrap:anywhere}.itemdesc{font-size:13px;color:var(--muted);margin-top:3px;white-space:pre-wrap;overflow-wrap:anywhere}.points{font-weight:800;color:var(--green);white-space:nowrap}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px}.claimed{font-size:12px;color:var(--green2);background:var(--mint);padding:7px 10px;border-radius:9px;font-weight:700}.empty{text-align:center;padding:28px 16px;color:var(--muted);background:white;border:1px dashed #cad8d0;border-radius:16px}.empty .big{font-size:30px;margin-bottom:8px}.empty b{display:block;color:var(--text);margin-bottom:4px}.pill{display:inline-flex;align-items:center;border-radius:999px;padding:4px 9px;background:#edf3ef;color:var(--muted);font-size:12px}.history-row{display:flex;gap:11px;align-items:flex-start}.history-sign{width:37px;height:37px;display:grid;place-items:center;border-radius:50%;background:#edf5f0;font-size:17px;flex-shrink:0}.history-detail{flex:1;min-width:0}.history-title{font-weight:700;overflow-wrap:anywhere}.history-date{font-size:12px;color:var(--muted);margin-top:3px}.change{font-weight:800;white-space:nowrap}.positive{color:#18734c}.negative{color:var(--red)}.after{font-size:11px;color:var(--muted);text-align:right;margin-top:3px}.field{display:flex;flex-direction:column;gap:6px;margin:13px 0}.field label{font-size:13px;font-weight:700}.field input,.field textarea{width:100%;padding:12px;border:1px solid #cbd8d0;border-radius:11px;background:white;color:var(--text);outline-color:var(--green2)}.field textarea{min-height:75px;resize:vertical}.tier-editor{border:1px solid var(--line);background:#f8fbf9;border-radius:13px;padding:12px;margin:10px 0}.tier-editor h3{font-size:14px;margin:0 0 8px}.tier-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tier-grid .field{margin:5px 0}.tier-grid .field label{font-size:12px}.tier-grid input{padding:10px}.tier-actions{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px}.tier-actions .sub{flex:1}.modal-backdrop{position:fixed;inset:0;background:rgba(9,25,18,.5);display:none;align-items:flex-end;justify-content:center;z-index:20;padding:12px}.modal-backdrop.show{display:flex}.modal{background:var(--bg);width:100%;max-width:560px;border-radius:22px 22px 18px 18px;padding:20px;max-height:90vh;overflow:auto}.modalhead{display:flex;justify-content:space-between;align-items:center;gap:10px}.modalhead h2{font-size:20px;margin:0}.close{width:36px;height:36px;padding:0;border-radius:50%;background:#e7eee9;color:var(--green);font-size:20px}.modal-buttons{display:flex;gap:9px;margin-top:18px}.modal-buttons button{flex:1}.notice{padding:11px 13px;background:#eaf5ee;border:1px solid #cde4d5;border-radius:12px;color:#185c3e;font-size:13px;margin-bottom:12px}.notice.warn{background:#fff5e4;border-color:#f2dfb7;color:#775000}.tasktabs{display:flex;gap:8px;margin:0 2px 14px}.tasktabs button{flex:1}.secret-hint{font-size:11px;color:var(--muted);text-align:center;margin-top:14px;user-select:none}.sectionlabel{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:750;margin:18px 2px 9px}.footer-tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.hide{display:none!important}@media(min-width:650px){.content{padding:22px}.top{padding:24px 24px 28px}.nav{position:sticky;bottom:0;border:1px solid var(--line);border-radius:16px;margin:0 14px 12px;padding-bottom:7px}.app{padding-bottom:0}.modal-backdrop{align-items:center}.modal{border-radius:22px}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="topline">
      <div class="brand"><div class="brand-mark">✦</div><span>Point Club</span></div>
      <span class="today" id="todayLabel"></span>
    </div>
    <div class="eyebrow" id="balanceLabel">Available balance</div>
    <div class="balance"><span id="balance">0</span> <small>points</small></div>
    <div class="today">Earn points, build habits, redeem rewards.</div>
  </header>
  <main class="content" id="content"></main>
  <nav class="nav" aria-label="Main navigation">
    <button data-page="daily" class="active"><span class="ico">☑</span>Daily tasks</button>
    <button data-page="weekly"><span class="ico">▦</span>Weekly</button>
    <button data-page="achievements"><span class="ico">🏆</span>Achievements</button>
    <button data-page="history"><span class="ico">↻</span>History</button>
    <button data-page="rewards"><span class="ico">🎁</span>Rewards</button>
  </nav>
</div>
<div class="modal-backdrop" id="modalBackdrop" role="dialog" aria-modal="true">
  <div class="modal">
    <div class="modalhead"><h2 id="modalTitle">Add item</h2><button class="close" id="closeModal" aria-label="Close">×</button></div>
    <form id="itemForm">
      <input type="hidden" id="itemId">
      <input type="hidden" id="itemType">
      <div class="field"><label for="itemName">Name</label><input id="itemName" maxlength="100" required placeholder="e.g. Exercise"></div>
      <div class="field" id="basePointsField"><label for="itemPoints">Points</label><input id="itemPoints" type="number" min="1" max="100000000" step="1" required placeholder="e.g. 20"></div>
      <div class="field" id="tierField"><label>Tier rewards (optional)</label><div class="sub">Use tiers when a task has multiple milestones. Each tier defines the repetition target, its description, and the cumulative total points earned.</div><div id="tierEditors"></div><div class="actions"><button type="button" class="secondary" id="addTierBtn">Add first tier</button></div></div>
      <div class="field"><label for="itemDesc">Description (optional)</label><textarea id="itemDesc" maxlength="500" placeholder="Add a note or details"></textarea></div>
      <div class="modal-buttons"><button type="button" class="secondary" id="cancelModal">Cancel</button><button type="submit" id="saveItem">Save</button></div>
    </form>
  </div>
</div>
<div class="modal-backdrop" id="confirmBackdrop" role="dialog" aria-modal="true">
  <div class="modal">
    <div class="modalhead"><h2 id="confirmTitle">Confirm</h2><button class="close" id="closeConfirm" aria-label="Close">×</button></div>
    <p id="confirmText"></p>
    <div class="modal-buttons"><button class="secondary" id="confirmCancel">Cancel</button><button class="danger" id="confirmOk">Delete</button></div>
  </div>
</div>
<script>
(() => {
  'use strict';
  const STORE = 'pointClubOffline.v1';
  const AUTO_BACKUP_STORE = 'pointClubOffline.autoBackup.v1';
  const DRIVE_AUTO_STORE = 'pointClubOffline.driveAutoBackup.v1';
  // Public OAuth Client ID for this browser-based app. Never put a client secret in HTML.
  const GOOGLE_CLIENT_ID = '608085034835-ll5rbb1kicg71o3tmncvno2tfafobk2l.apps.googleusercontent.com';
  const DRIVE_FILE_NAME = 'point-club-backup.json';
  const DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.file';
  let driveTokenClient = null, driveAccessToken = null, drivePendingAction = null, driveScriptPromise = null;
  let driveAutoTimer = null, driveAutoAuthRequested = false, driveStatusMessage = 'Google Drive backup is ready to configure.';
  const $ = id => document.getElementById(id);
  const todayKey = () => {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  };
  const weekKey = (date=new Date()) => { const d=new Date(date); d.setHours(0,0,0,0); d.setDate(d.getDate()-((d.getDay()+6)%7)); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
  const todayKeyForDate = date => { const d=new Date(date); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
  const uid = () => 'i' + Date.now().toString(36) + Math.random().toString(36).slice(2,8);
  const fmt = n => Number(n).toLocaleString(undefined,{maximumFractionDigits:0});
  const escapeHTML = s => String(s ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const dateTime = iso => {
    const d = new Date(iso);
    return Number.isNaN(d.getTime()) ? '' : d.toLocaleString([], {dateStyle:'medium',timeStyle:'short'});
  };
  const blankState = () => ({version:1,balance:0,dailyTasks:[],weeklyTasks:[],secretDailyTasks:[],secretWeeklyTasks:[],secretAchievements:[],secretHistoryLabel:'',maskSecretNames:true,achievements:[],rewards:[],history:[],claimedDaily:{},claimedWeekly:{},claimedSecretDaily:{},claimedSecretWeekly:{},claimedSecretAchievements:[],claimedAchievements:[]});
  let state = load();
  let lastPointSignature = pointSignature();
  let page = 'daily';
  let taskMode = 'regular';
  let secretUnlocked = false;
  let titleTapCount = 0, titleTapTimer = null, secretInactivityTimer = null;
  const SECRET_TIMEOUT_MS = 60000;
  function armSecretLock(){
    if(!secretUnlocked)return;
    clearTimeout(secretInactivityTimer);
    secretInactivityTimer=setTimeout(()=>{secretUnlocked=false;taskMode='regular';titleTapCount=0;render();},SECRET_TIMEOUT_MS);
  }
  function lockSecret(){secretUnlocked=false;taskMode='regular';clearTimeout(secretInactivityTimer);secretInactivityTimer=null;}
  let confirmAction = null;
  function load(){
    try{
      const raw=localStorage.getItem(STORE);
      if(!raw) return blankState();
      const s=JSON.parse(raw), b=blankState();
      return {...b,...s,
        dailyTasks:Array.isArray(s.dailyTasks)?s.dailyTasks:[],
        weeklyTasks:Array.isArray(s.weeklyTasks)?s.weeklyTasks:[],
        secretDailyTasks:Array.isArray(s.secretDailyTasks)?s.secretDailyTasks:[],
        secretWeeklyTasks:Array.isArray(s.secretWeeklyTasks)?s.secretWeeklyTasks:[],
        secretAchievements:Array.isArray(s.secretAchievements)?s.secretAchievements:[],
        achievements:Array.isArray(s.achievements)?s.achievements:[],
        rewards:Array.isArray(s.rewards)?s.rewards:[],
        history:Array.isArray(s.history)?s.history.map(h=>{
          if(h&&(['Secret daily task','Secret weekly task','Secret achievement'].includes(h.kind)||['secretDaily','secretWeekly','secretAchievement'].includes(h.sourceType))){
            return {...h,kind:'Bonus point',label:(String(s.secretHistoryLabel||'').trim()||'Bonus point'),sourceType:h.sourceType||(h.kind==='Secret daily task'?'secretDaily':h.kind==='Secret achievement'?'secretAchievement':'secretWeekly')};
          }
          return h;
        }):[],
        secretHistoryLabel:typeof s.secretHistoryLabel==='string'?s.secretHistoryLabel:'',
        maskSecretNames:typeof s.maskSecretNames==='boolean'?s.maskSecretNames:true,
        claimedDaily:s.claimedDaily&&typeof s.claimedDaily==='object'?s.claimedDaily:{},
        claimedWeekly:s.claimedWeekly&&typeof s.claimedWeekly==='object'?s.claimedWeekly:{},
        claimedSecretDaily:s.claimedSecretDaily&&typeof s.claimedSecretDaily==='object'?s.claimedSecretDaily:{},
        claimedSecretWeekly:s.claimedSecretWeekly&&typeof s.claimedSecretWeekly==='object'?s.claimedSecretWeekly:{},
        claimedSecretAchievements:Array.isArray(s.claimedSecretAchievements)?s.claimedSecretAchievements:[],
        claimedAchievements:Array.isArray(s.claimedAchievements)?s.claimedAchievements:[]};
    }catch(e){return blankState();}
  }
  function save(){
    const signature=pointSignature();
    const pointDataChanged=signature!==lastPointSignature;
    lastPointSignature=signature;
    const snapshot=JSON.stringify({...state,exportedAt:new Date().toISOString()},null,2);
    let mainSaved=false,backupSaved=false;
    try{localStorage.setItem(STORE,JSON.stringify(state));mainSaved=true;}catch(e){}
    try{localStorage.setItem(AUTO_BACKUP_STORE,snapshot);backupSaved=true;}catch(e){}
    if(!mainSaved)alert('The app could not save its main data. Check available browser storage and export a backup if possible.');
    else if(!backupSaved)console.warn('Automatic local backup could not be updated because browser storage is full.');
    if(pointDataChanged)queueDriveAutoBackup(signature);
  }
  function checkNewDay(){
    // Daily claims are keyed by local calendar date, so availability resets at local midnight.
    const today=todayKey();
    Object.keys(state.claimedDaily).forEach(id=>{
      if(state.claimedDaily[id]!==today) delete state.claimedDaily[id];
    });
    const week=weekKey();
    Object.keys(state.claimedWeekly).forEach(id=>{ if(state.claimedWeekly[id]!==week) delete state.claimedWeekly[id]; });
    Object.keys(state.claimedSecretDaily).forEach(id=>{ if(state.claimedSecretDaily[id]!==today) delete state.claimedSecretDaily[id]; });
    Object.keys(state.claimedSecretWeekly).forEach(id=>{ if(state.claimedSecretWeekly[id]!==week) delete state.claimedSecretWeekly[id]; });
    save();
    $('todayLabel').textContent=new Date().toLocaleDateString([], {weekday:'short',month:'short',day:'numeric'});
  }
  function addHistory(kind,label,delta,itemId=null,sourceType=null){
    state.balance += delta;
    state.history.unshift({id:uid(),kind,label:String(label),delta,balanceAfter:state.balance,at:new Date().toISOString(),itemId,sourceType});
    save();
  }
  function setPage(next){page=next;if(next!=='achievements'&&taskMode==='secretAchievements')taskMode='regular';if(next==='achievements'&&taskMode!=='secretAchievements')taskMode='regular';document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));render();}
  document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>setPage(b.dataset.page)));
  function validTiers(raw){
    if(!Array.isArray(raw))return [];
    const tiers=raw.map(t=>({repetitions:Number(t.repetitions),points:Number(t.points),description:String(t.description||'').trim()})).filter(t=>Number.isSafeInteger(t.repetitions)&&t.repetitions>0&&Number.isSafeInteger(t.points)&&t.points>=0).sort((a,b)=>a.repetitions-b.repetitions);
    return tiers.every((t,i)=>i===0||(t.repetitions>tiers[i-1].repetitions&&t.points>=tiers[i-1].points))?tiers:[];
  }
  function getTierProgress(item,type,period){
    const isDaily=type==='daily'||type==='secretDaily';
    const key=isDaily?'tierDailyProgress':'tierWeeklyProgress';
    if(!state[key]||typeof state[key]!=='object')state[key]={};
    const p=state[key][item.id];
    if(!p||p.period!==period)return {period,repetitions:0,tierIndex:-1,awardedPoints:0};
    return {period,repetitions:Number(p.repetitions)||0,tierIndex:Number.isInteger(p.tierIndex)?p.tierIndex:-1,awardedPoints:Number(p.awardedPoints)||0};
  }
  function nextTier(tiers,progress){return tiers.find(t=>t.repetitions>progress.repetitions)||tiers[tiers.length-1];}
  function parseTierEditors(){
    const editors=[...$('tierEditors').querySelectorAll('.tier-editor')];
    const tiers=editors.map((el,i)=>({repetitions:Number(el.querySelector('[data-tier-reps]').value),description:el.querySelector('[data-tier-description]').value.trim(),points:Number(el.querySelector('[data-tier-points]').value)}));
    if(!tiers.length)return [];
    if(tiers.some((t,i)=>!Number.isSafeInteger(t.repetitions)||t.repetitions<1||!Number.isSafeInteger(t.points)||t.points<0||!t.description))throw new Error('Enter a positive repetition target, a description, and whole-number total points for every tier.');
    if(tiers.some((t,i)=>i>0&&(t.repetitions<=tiers[i-1].repetitions||t.points<tiers[i-1].points)))throw new Error('Each tier must require more repetitions and have equal or greater cumulative total points than the previous tier.');
    return tiers;
  }
  function renderTierEditors(tiers=[]){
    const root=$('tierEditors');
    root.innerHTML=tiers.map((t,i)=>`<section class="tier-editor" data-tier-index="${i}"><h3>Tier ${i+1}</h3><div class="tier-grid"><div class="field"><label>Repetitions required</label><input data-tier-reps type="number" min="1" step="1" required value="${Number(t.repetitions)|| (i===0?1:(Number(tiers[i-1]?.repetitions)||1)+1)}" placeholder="e.g. ${i===0?1:(Number(tiers[i-1]?.repetitions)||1)+1}"></div><div class="field"><label>Cumulative total points</label><input data-tier-points type="number" min="0" step="1" required value="${Number.isFinite(Number(t.points))?Number(t.points):(i===0?1:Number(tiers[i-1]?.points)||1)}" placeholder="e.g. 5"></div></div><div class="field"><label>Tier description</label><input data-tier-description maxlength="160" required value="${escapeHTML(t.description||`Tier ${i+1}`)}" placeholder="e.g. Complete 10 repetitions"></div>${i>0?`<div class="tier-actions"><span class="sub">Reached after Tier ${i}</span><button type="button" class="danger small" data-remove-tier="${i}">Remove tier</button></div>`:''}</section>`).join('');
    $('addTierBtn').textContent=tiers.length?'Add next tier':'Add first tier';
    $('basePointsField').classList.toggle('hide',tiers.length>0);
    $('itemPoints').required=tiers.length===0;
    $('addTierBtn').classList.toggle('hide',!['daily','weekly','secretDaily','secretWeekly'].includes($('itemType').value));
  }
  function setTierEditors(tiers){
    renderTierEditors(tiers);
  }
  function earnTier(item,type){
    const isDaily=type==='daily'||type==='secretDaily', period=isDaily?todayKey():weekKey(), key=isDaily?'tierDailyProgress':'tierWeeklyProgress';
    const tiers=validTiers(item.tiers); if(!tiers.length)return false;
    const progress=getTierProgress(item,type,period);
    if(progress.tierIndex>=tiers.length-1&&progress.repetitions>=tiers[tiers.length-1].repetitions)return true;
    const target=nextTier(tiers,progress), newReps=target.repetitions, newIndex=tiers.indexOf(target);
    const increment=Math.max(0,target.points-progress.awardedPoints);
    const kind=type.startsWith('secret')?'Bonus point':(isDaily?'Daily task':'Weekly task');
    const label=type.startsWith('secret')?(String(state.secretHistoryLabel||'').trim()||'Bonus point'):`${item.name} — ${target.description||`Tier ${newIndex+1}`}`;
    // Keep only the current tier transaction in History, while preserving the prior tier as undo metadata.
    const isMatchingLegacy=h=>h.itemId===item.id&&h.tierProgress&&!h.tierRecord&&((type.startsWith('secret')?h.sourceType===type:(h.kind===(isDaily?'Daily task':'Weekly task')&&!h.sourceType)))&&(()=>{const d=new Date(h.at);return !Number.isNaN(d.getTime())&&(isDaily?todayKeyForDate(d)===period:weekKey(d)===period);})();
    const legacy=state.history.filter(isMatchingLegacy).sort((a,b)=>(Number(a.tierProgress?.tierIndex)||0)-(Number(b.tierProgress?.tierIndex)||0));
    let legacyChain=null, cumulative=0;
    for(const old of legacy){cumulative+=Number(old.delta)||0;legacyChain={delta:cumulative,label:old.label,kind:old.kind,at:old.at,tierProgress:old.tierProgress,tierDescription:tiers[old.tierProgress?.tierIndex]?.description||`Tier ${(Number(old.tierProgress?.tierIndex)||0)+1}`,tierPoints:cumulative,tierPrevious:legacyChain};}
    const currentIndex=state.history.findIndex(h=>h.itemId===item.id&&h.tierRecord&&h.tierPeriod===period&&h.tierSourceType===type);
    const previousRecord=currentIndex>=0?state.history[currentIndex]:(legacyChain?{...legacyChain,tierRecord:true,tierSourceType:type,tierPeriod:period}:null);
    if(currentIndex>=0)state.history.splice(currentIndex,1);
    if(legacy.length)state.history=state.history.filter(h=>!isMatchingLegacy(h));
    state.balance+=increment;
    const entry={id:uid(),kind,label,delta:target.points,balanceAfter:state.balance,at:new Date().toISOString(),itemId:item.id,sourceType:type.startsWith('secret')?type:null,tierRecord:true,tierSourceType:type,tierPeriod:period,tierProgress:{repetitions:newReps,tierIndex:newIndex,awardedPoints:target.points},tierDescription:target.description||`Tier ${newIndex+1}`,tierPoints:target.points,tierPrevious:previousRecord?{delta:previousRecord.delta,label:previousRecord.label,kind:previousRecord.kind,at:previousRecord.at,tierProgress:previousRecord.tierProgress,tierDescription:previousRecord.tierDescription,tierPoints:previousRecord.tierPoints,tierPrevious:previousRecord.tierPrevious}:null};
    if(type.startsWith('secret'))entry.secretName=item.name;
    state.history.unshift(entry);
    state[key][item.id]={period,repetitions:newReps,tierIndex:newIndex,awardedPoints:target.points};
    save();
    return true;
  }
  function itemCard(item,type){
    const icons={daily:'☑',weekly:'▦',secretDaily:'◆',secretWeekly:'◆',secretAchievement:'◆',achievement:'🏆',reward:'🎁'};
    const claimKey={daily:'claimedDaily',weekly:'claimedWeekly',secretDaily:'claimedSecretDaily',secretWeekly:'claimedSecretWeekly'};
    const periodKey=type==='daily'||type==='secretDaily'?todayKey():weekKey();

  function processScheduledDriveBackup(onStartup=false){
    const meta=readDriveAutoMeta();
    if(!meta.pendingKey||meta.completedKey===meta.pendingKey)return;
    const dueAt=(Number(meta.pendingAt)||0)+60*60*1000;
    const remaining=dueAt-Date.now();
    if(remaining>0){
      clearTimeout(driveAutoTimer);
      driveAutoTimer=setTimeout(()=>processScheduledDriveBackup(false),remaining);
      return;
    }
    if(driveAccessToken){
      uploadDriveBackup().then(()=>setDriveStatus('Scheduled Google Drive backup completed at '+new Date().toLocaleTimeString()+'.'))
        .catch(err=>{
          setDriveStatus('Scheduled backup is still pending: '+err.message+'. Tap Connect Google Drive to reauthorize and retry.');
          if(/HTTP 401|not connected/i.test(err.message))driveAccessToken=null;
        });
      return;
    }
    if(driveAutoAuthRequested)return;
    driveAutoAuthRequested=true;
    setDriveStatus('A scheduled backup is overdue. Google authorization may require a popup; if it is blocked or does not open, tap Connect Google Drive.');
    drivePendingAction='autoUpload';
    requestDriveToken(GOOGLE_CLIENT_ID);
  }
  function drivePayload(){return JSON.stringify({...state,exportedAt:new Date().toISOString()},null,2);}
  function setupDriveControls(){
    const meta=readDriveAutoMeta();
    setDriveStatus(meta.pendingKey&&meta.completedKey!==meta.pendingKey?'Automatic backup pending. It will upload one hour after the latest point change, or when overdue and the app next opens.':driveStatusMessage);
    $('driveConnect')?.addEventListener('click',()=>{drivePendingAction='connect';setDriveStatus('Connecting to Google…');requestDriveToken(GOOGLE_CLIENT_ID);});
    $('driveRestore')?.addEventListener('click',()=>{drivePendingAction='restore';setDriveStatus('Authorizing Google Drive access…');requestDriveToken(GOOGLE_CLIENT_ID);});
    $('driveBackupNow')?.addEventListener('click',()=>{
      if(driveAccessToken){uploadDriveBackup().then(()=>setDriveStatus('Manual backup completed.')).catch(err=>{setDriveStatus('Backup failed: '+err.message);alert('Google Drive backup failed: '+err.message);});}
      else{drivePendingAction='upload';setDriveStatus('Authorizing Google Drive access…');requestDriveToken(GOOGLE_CLIENT_ID);}
    });
  }
  function loadGoogleIdentity(){
    if(window.google?.accounts?.oauth2)return Promise.resolve();
    if(driveScriptPromise)return driveScriptPromise;
    driveScriptPromise=new Promise((resolve,reject)=>{
      const script=document.createElement('script');script.src='https://accounts.google.com/gsi/client';script.async=true;script.defer=true;
      script.onload=()=>window.google?.accounts?.oauth2?resolve():reject(new Error('Google Identity Services did not load.'));
      script.onerror=()=>reject(new Error('Could not load Google sign-in. Check your internet connection and app origin.'));
      document.head.appendChild(script);
    });return driveScriptPromise;
  }
  async function requestDriveToken(clientId){
    try{
      await loadGoogleIdentity();
      driveTokenClient=google.accounts.oauth2.initTokenClient({client_id:clientId,scope:DRIVE_SCOPE,callback:async response=>{
        if(response.error||!response.access_token){
          driveAccessToken=null;driveAutoAuthRequested=false;
          setDriveStatus('Google authorization was not completed. If a scheduled backup is pending, tap Connect Google Drive to retry.');
          if(drivePendingAction!=='autoUpload')alert('Google Drive authorization failed: '+(response.error_description||response.error||'No access token returned.'));
          drivePendingAction=null;
          return;
        }
        driveAccessToken=response.access_token;driveAutoAuthRequested=false;
        const action=drivePendingAction;drivePendingAction=null;
        try{if(action==='connect'){setDriveStatus('Connected to Google Drive for this session. Scheduled backups will upload after one hour without further point changes.');processScheduledDriveBackup(false);}else if(action==='upload'){await uploadDriveBackup();setDriveStatus('Manual backup completed at '+new Date().toLocaleTimeString()+'.');}else if(action==='autoUpload'){await uploadDriveBackup();setDriveStatus('Scheduled Google Drive backup completed at '+new Date().toLocaleTimeString()+'.');}else if(action==='restore'){await downloadDriveBackup();}}
        catch(err){setDriveStatus('Drive operation failed: '+err.message);alert('Google Drive backup failed: '+err.message);}
      },error_callback:error=>{driveAutoAuthRequested=false;setDriveStatus('Google authorization window was closed or blocked.');alert('Google authorization did not complete. '+(error?.message||''));}});
      driveTokenClient.requestAccessToken({prompt:''});
    }catch(err){driveAutoAuthRequested=false;setDriveStatus(err.message);alert(err.message+'\n\nGoogle Drive requires the app to run from an authorized HTTPS origin or localhost, not file://.');}
  }
  async function driveApi(url,options={}){
    if(!driveAccessToken)throw new Error('Not connected to Google Drive.');
    const response=await fetch(url,{...options,headers:{Authorization:'Bearer '+driveAccessToken,...(options.headers||{})}});
    if(!response.ok){let detail='';try{detail=(await response.json()).error?.message||'';}catch(e){}if(response.status===401)driveAccessToken=null;throw new Error(detail||('Google Drive API returned HTTP '+response.status));}
    if(response.status===204)return null;
    const ct=response.headers.get('content-type')||'';return ct.includes('application/json')?response.json():response.text();
  }
  async function findDriveBackup(){
    const q=encodeURIComponent("name='"+DRIVE_FILE_NAME+"' and trashed=false");
    const result=await driveApi('https://www.googleapis.com/drive/v3/files?spaces=drive&q='+q+'&pageSize=100&orderBy=modifiedTime%20desc&fields=files(id,name,modifiedTime)');
    return result.files?.[0]||null;
  }
  async function uploadDriveBackup(){
    setDriveStatus('Uploading backup to Google Drive…');
    const uploadedSignature=pointSignature();const existing=await findDriveBackup();const content=drivePayload();
    if(existing){
      await driveApi('https://www.googleapis.com/upload/drive/v3/files/'+encodeURIComponent(existing.id)+'?uploadType=media',{method:'PATCH',headers:{'Content-Type':'application/json'},body:content});
    }else{
      const boundary='pointclub_'+uid();const metadata=JSON.stringify({name:DRIVE_FILE_NAME,mimeType:'application/json'});
      const body='--'+boundary+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+metadata+'\r\n--'+boundary+'\r\nContent-Type: application/json\r\n\r\n'+content+'\r\n--'+boundary+'--';
      await driveApi('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+boundary},body});
    }
    markDriveBackupComplete(uploadedSignature);
    if(pointSignature()!==uploadedSignature)queueDriveAutoBackup(pointSignature());
    setDriveStatus('Backup uploaded to Google Drive at '+new Date().toLocaleTimeString()+'.');
  }
  async function downloadDriveBackupFile(){
    setDriveStatus('Looking for the latest Drive backup…');const file=await findDriveBackup();
    if(!file){setDriveStatus('No Point Club backup found in this Google account.');alert('No Point Club backup was found in this Google account.');return;}
    const response=await fetch('https://www.googleapis.com/drive/v3/files/'+encodeURIComponent(file.id)+'?alt=media',{headers:{Authorization:'Bearer '+driveAccessToken}});
    if(!response.ok){if(response.status===401)driveAccessToken=null;throw new Error('Could not download the backup (HTTP '+response.status+').');}
    const blob=await response.blob();const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='point-club-drive-backup-'+todayKey()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
    setDriveStatus('Drive backup downloaded to this device.');
  }
  async function downloadDriveBackup(){
    setDriveStatus('Looking for the latest Drive backup…');const file=await findDriveBackup();
    if(!file){setDriveStatus('No Point Club backup found in this Google account.');alert('No Point Club backup was found in this Google account.');return;}
    const response=await fetch('https://www.googleapis.com/drive/v3/files/'+encodeURIComponent(file.id)+'?alt=media',{headers:{Authorization:'Bearer '+driveAccessToken}});
    if(!response.ok){if(response.status===401)driveAccessToken=null;throw new Error('Could not download the backup (HTTP '+response.status+').');}
    const backup=await response.text();
    let parsed;try{parsed=JSON.parse(backup);}catch(e){throw new Error('The Drive file is not valid JSON.');}
    if(!parsed||!Number.isFinite(parsed.balance)||!Array.isArray(parsed.dailyTasks)||!Array.isArray(parsed.achievements)||!Array.isArray(parsed.rewards)||!Array.isArray(parsed.history))throw new Error('The Drive file is not a valid Point Club backup.');
    showConfirm('Restore Drive backup?',`Restore the latest Google Drive backup (${file.modifiedTime?new Date(file.modifiedTime).toLocaleString():'modified date unavailable'})? This replaces the data currently on this device.`,()=>{
      const clean={...blankState(),...parsed,weeklyTasks:Array.isArray(parsed.weeklyTasks)?parsed.weeklyTasks:[],secretDailyTasks:Array.isArray(parsed.secretDailyTasks)?parsed.secretDailyTasks:[],secretWeeklyTasks:Array.isArray(parsed.secretWeeklyTasks)?parsed.secretWeeklyTasks:[],secretAchievements:Array.isArray(parsed.secretAchievements)?parsed.secretAchievements:[],claimedWeekly:parsed.claimedWeekly&&typeof parsed.claimedWeekly==='object'?parsed.claimedWeekly:{},claimedSecretDaily:parsed.claimedSecretDaily&&typeof parsed.claimedSecretDaily==='object'?parsed.claimedSecretDaily:{},claimedSecretWeekly:parsed.claimedSecretWeekly&&typeof parsed.claimedSecretWeekly==='object'?parsed.claimedSecretWeekly:{},claimedSecretAchievements:Array.isArray(parsed.claimedSecretAchievements)?parsed.claimedSecretAchievements:[]};delete clean.exportedAt;state={...clean,version:1};save();render();alert('Google Drive backup restored.');
    },'Restore');
    setDriveStatus('Latest backup found. Confirm the restore prompt to replace local data.');
  }
  function exportBackup(){
    const data=JSON.stringify({...state,exportedAt:new Date().toISOString()},null,2);
    const blob=new Blob([data],{type:'application/json'});
    const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='point-club-backup-'+todayKey()+'.json';document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);
  }
  function downloadAutoBackup(){
    try{const raw=localStorage.getItem(AUTO_BACKUP_STORE);if(!raw){alert('No automatic backup is available yet.');return;}downloadJSON(raw,'point-club-auto-backup-'+todayKey()+'.json');}
    catch(e){alert('Could not access the automatic backup in this browser.');}
  }
  function downloadJSON(data,filename){
    const blob=new Blob([data],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
  }
  function restoreAutoBackup(){
    let raw;try{raw=localStorage.getItem(AUTO_BACKUP_STORE);}catch(e){}
    if(!raw){alert('No automatic backup is available yet.');return;}
    try{const parsed=JSON.parse(raw);if(!parsed||!Number.isFinite(parsed.balance)||!Array.isArray(parsed.dailyTasks)||!Array.isArray(parsed.history))throw new Error('Invalid backup');
      showConfirm('Restore automatic backup?','This replaces the current Point Club data with the most recent locally saved backup.',()=>{const clean={...blankState(),...parsed};delete clean.exportedAt;state={...clean,version:1};save();render();alert('Automatic backup restored.');},'Restore');
    }catch(e){alert('The automatic backup is invalid or damaged.');}
  }
  function refreshAutoBackup(){try{localStorage.setItem(AUTO_BACKUP_STORE,JSON.stringify({...state,exportedAt:new Date().toISOString()},null,2));}catch(e){}}
  function importBackup(e){
    const file=e.target.files?.[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=()=>{
      try{
        const s=JSON.parse(reader.result);
        if(!s||!Number.isFinite(s.balance)||!Array.isArray(s.dailyTasks)||!Array.isArray(s.achievements)||!Array.isArray(s.rewards)||!Array.isArray(s.history))throw new Error('Invalid backup');
        showConfirm('Import backup?', 'Importing replaces the data currently saved on this device. Export your current data first if you want to keep it.',()=>{
          const clean={...blankState(),...s,weeklyTasks:Array.isArray(s.weeklyTasks)?s.weeklyTasks:[],secretDailyTasks:Array.isArray(s.secretDailyTasks)?s.secretDailyTasks:[],secretWeeklyTasks:Array.isArray(s.secretWeeklyTasks)?s.secretWeeklyTasks:[],secretAchievements:Array.isArray(s.secretAchievements)?s.secretAchievements:[],secretHistoryLabel:typeof s.secretHistoryLabel==='string'?s.secretHistoryLabel:'',maskSecretNames:typeof s.maskSecretNames==='boolean'?s.maskSecretNames:true,history:Array.isArray(s.history)?s.history.map(h=>{if(h&&(['Secret daily task','Secret weekly task','Secret achievement'].includes(h.kind)||['secretDaily','secretWeekly','secretAchievement'].includes(h.sourceType)))return {...h,kind:'Bonus point',label:(String(s.secretHistoryLabel||'').trim()||'Bonus point'),sourceType:h.sourceType||(h.kind==='Secret weekly task'?'secretWeekly':h.kind==='Secret achievement'?'secretAchievement':'secretDaily')};return h;}):[],claimedWeekly:s.claimedWeekly&&typeof s.claimedWeekly==='object'?s.claimedWeekly:{},claimedSecretDaily:s.claimedSecretDaily&&typeof s.claimedSecretDaily==='object'?s.claimedSecretDaily:{},claimedSecretWeekly:s.claimedSecretWeekly&&typeof s.claimedSecretWeekly==='object'?s.claimedSecretWeekly:{},claimedSecretAchievements:Array.isArray(s.claimedSecretAchievements)?s.claimedSecretAchievements:[]};
          delete clean.exportedAt;
          state={...clean,version:1};
          save();render();alert('Backup imported.');
        },'Import');
      }catch(err){alert('This file is not a valid Point Club backup.');}
      e.target.value='';
    };
    reader.onerror=()=>alert('Could not read this file.');
    reader.readAsText(file);
  }
  // Keep midnight reset correct even if the app remains open across midnight.
  let lastDay=todayKey(), lastWeek=weekKey();
  setInterval(()=>{const now=todayKey(),week=weekKey();if(now!==lastDay||week!==lastWeek){lastDay=now;lastWeek=week;render();}},15000);
  document.addEventListener('visibilitychange',()=>{if(document.hidden){refreshAutoBackup();}else{render();if(secretUnlocked)armSecretLock();processScheduledDriveBackup(false);}});
  window.addEventListener('pagehide',refreshAutoBackup);
  window.addEventListener('beforeunload',refreshAutoBackup);
  window.addEventListener('pageshow',()=>processScheduledDriveBackup(true));
  window.addEventListener('online',()=>processScheduledDriveBackup(false));
  document.addEventListener('resume',()=>processScheduledDriveBackup(false));
  ['pointerdown','pointermove','keydown','touchstart'].forEach(evt=>document.addEventListener(evt,()=>{if(secretUnlocked)armSecretLock();},{passive:true}));
  render();
  const startupDriveMeta=readDriveAutoMeta();
  if(startupDriveMeta.pendingKey&&startupDriveMeta.completedKey!==startupDriveMeta.pendingKey){
    const dueAt=(Number(startupDriveMeta.pendingAt)||0)+60*60*1000;
    if(dueAt>Date.now())driveAutoTimer=setTimeout(()=>processScheduledDriveBackup(false),dueAt-Date.now());
    else setDriveStatus('A Google Drive backup is overdue. It will be attempted now; if Google authorization is blocked, tap Connect Google Drive.');
  }
  processScheduledDriveBackup(true);
})();
</script>
